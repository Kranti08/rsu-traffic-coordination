[General]
cmdenv-express-mode = true
cmdenv-autoflush = true
image-path = ../../images
network = GridScenario

sim-time-limit = 200s
**.scalar-recording = true
**.vector-recording = true

*.playgroundSizeX = 900m
*.playgroundSizeY = 900m
*.playgroundSizeZ = 50m
*.annotations.draw = true

##### TraCI manager -> our grid #####
*.manager.updateInterval = 1s
*.manager.host = "localhost"
*.manager.port = 9999
*.manager.autoShutdown = true
*.manager.launchConfig = xmldoc("grid.launchd.xml")

##### RSUs distributed across the 5x5 grid #####
# center of grid (SUMO 400,400)
*.rsu[0].mobility.x = 425
*.rsu[0].mobility.y = 425
*.rsu[0].mobility.z = 3
# four quadrant intersections
*.rsu[1].mobility.x = 225
*.rsu[1].mobility.y = 625
*.rsu[1].mobility.z = 3
*.rsu[2].mobility.x = 625
*.rsu[2].mobility.y = 625
*.rsu[2].mobility.z = 3
*.rsu[3].mobility.x = 225
*.rsu[3].mobility.y = 225
*.rsu[3].mobility.z = 3
*.rsu[4].mobility.x = 625
*.rsu[4].mobility.y = 225
*.rsu[4].mobility.z = 3

*.rsu[*].applType = "org.car2x.veins.modules.application.RSUTrafficCoordination"
*.rsu[*].appl.headerLength = 80 bit
*.rsu[*].appl.sendBeacons = true
*.rsu[*].appl.beaconInterval = 1s
*.rsu[0].appl.failureTime = 60s
*.rsu[*].nic.phy80211p.antennaOffsetZ = 0 m

##### NIC settings #####
*.connectionManager.sendDirect = true
*.connectionManager.maxInterfDist = 2600m
*.connectionManager.drawMaxIntfDist = false
*.**.nic.mac1609_4.useServiceChannel = false
*.**.nic.mac1609_4.txPower = 20mW
*.**.nic.mac1609_4.bitrate = 6Mbps
*.**.nic.phy80211p.minPowerLevel = -110dBm
*.**.nic.phy80211p.useNoiseFloor = true
*.**.nic.phy80211p.noiseFloor = -98dBm
*.**.nic.phy80211p.decider = xmldoc("config.xml")
*.**.nic.phy80211p.analogueModels = xmldoc("config.xml")
*.**.nic.phy80211p.usePropagationDelay = true
*.**.nic.phy80211p.antenna = xmldoc("antenna.xml", "/root/Antenna[@id='monopole']")
*.node[*].nic.phy80211p.antennaOffsetY = 0 m

##### Vehicles: demo app, silent (no beacons) #####
*.node[*].applType = "org.car2x.veins.modules.application.VehicleDestApp"
*.node[*].appl.headerLength = 80 bit
*.node[*].appl.sendBeacons = true
*.node[*].appl.dataOnSch = false
*.node[*].appl.beaconInterval = 1s

##### Mobility #####
*.node[*].veinsmobility.x = 0
*.node[*].veinsmobility.y = 0
*.node[*].veinsmobility.z = 0
*.node[*].veinsmobility.setHostSpeed = false
*.rsu[2].appl.byzantineTime = 40s

# ============ EXPERIMENT CONFIGS ============
# Heavier traffic for all experiments (city-scale demand)
[Config ExpBase]
*.manager.launchConfig = xmldoc("grid_heavy.launchd.xml")
sim-time-limit = 200s
*.rsu[2].appl.byzantineTime = 40s

# ----- VERSION A: baseline (no protocol) -----
[Config A_0fail]
extends = ExpBase
*.rsu[*].appl.enableValidation = false
*.rsu[*].appl.enableVoting = false
*.rsu[*].appl.enableDegradation = false
*.rsu[*].appl.enableRerouting = false
*.rsu[0].appl.failureTime = -1s

[Config A_1fail]
extends = A_0fail
*.rsu[0].appl.failureTime = 60s

[Config A_2fail]
extends = A_0fail
*.rsu[0].appl.failureTime = 60s
*.rsu[1].appl.failureTime = 120s

[Config A_3fail]
extends = A_0fail
*.rsu[0].appl.failureTime = 60s
*.rsu[1].appl.failureTime = 120s
*.rsu[2].appl.failureTime = 150s

# ----- VERSION B: coordination only, no failure response -----
[Config B_0fail]
extends = ExpBase
*.rsu[*].appl.enableValidation = true
*.rsu[*].appl.enableVoting = true
*.rsu[*].appl.enableDegradation = false
*.rsu[*].appl.enableRerouting = false
*.rsu[0].appl.failureTime = -1s

[Config B_1fail]
extends = B_0fail
*.rsu[0].appl.failureTime = 60s

[Config B_2fail]
extends = B_0fail
*.rsu[0].appl.failureTime = 60s
*.rsu[1].appl.failureTime = 120s

[Config B_3fail]
extends = B_0fail
*.rsu[0].appl.failureTime = 60s
*.rsu[1].appl.failureTime = 120s
*.rsu[2].appl.failureTime = 150s

# ----- VERSION C: full protocol -----
[Config C_0fail]
extends = ExpBase
*.rsu[*].appl.enableValidation = true
*.rsu[*].appl.enableVoting = true
*.rsu[*].appl.enableDegradation = true
*.rsu[*].appl.enableRerouting = true
*.rsu[0].appl.failureTime = -1s

[Config C_1fail]
extends = C_0fail
*.rsu[0].appl.failureTime = 60s

[Config C_2fail]
extends = C_0fail
*.rsu[0].appl.failureTime = 60s
*.rsu[1].appl.failureTime = 120s

[Config C_3fail]
extends = C_0fail
*.rsu[0].appl.failureTime = 60s
*.rsu[1].appl.failureTime = 120s
*.rsu[2].appl.failureTime = 150s
